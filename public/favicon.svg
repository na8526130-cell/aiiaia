<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="mathGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Blue Rounded Background (Math / Education theme) -->
  <rect width="512" height="512" rx="120" fill="url(#mathGrad)" />
  <!-- Mathematical Sigma ∑ Symbol -->
  <text
    x="50%"
    y="54%"
    dominant-baseline="central"
    text-anchor="middle"
    font-size="320"
    font-weight="bold"
    font-family="'Cambria Math', 'Times New Roman', STIXGeneral, serif"
    fill="#ffffff"
    filter="url(#shadow)"
  >∑</text>
</svg>
